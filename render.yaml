services:
  - type: web
    name: dentalpin-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dentalpin-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://dental-clinic-mu-ruby.vercel.app,http://localhost:3000
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_PATH
        value: /app/storage
      - key: RUN_MIGRATIONS
        value: "1"
      - key: SEED_ON_STARTUP
        value: "1"
      - key: SEED_LANG
        value: es

databases:
  - name: dentalpin-db
    databaseName: dental_clinic
    user: dental
    plan: free
    region: frankfurt
